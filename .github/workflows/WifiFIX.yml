name: Auto-Search & Build RK915 WiFi Package

on:
  workflow_dispatch:

jobs:
  search-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Repositories klonen, echte Firmware finden und Skript erstellen
        run: |
          python3 - << 'EOF'
          import os
          import subprocess
          import shutil
          import urllib.request

          output_dir = "wifi_package"
          firmware_dir = os.path.join(output_dir, "lib", "firmware")
          os.makedirs(firmware_dir, exist_ok=True)

          repos_to_clone = [
              "https://github.com/lcdyk0517/arkos4clone.git",
              "https://github.com/AeolusUX/ArkOS-R3XS.git"
          ]

          found_cal = False
          found_para = False
          clone_base = "cloned_repos"
          os.makedirs(clone_base, exist_ok=True)

          # 1. Versuche die Dateien über einen Git-Klon zu finden
          for i, repo_url in enumerate(repos_to_clone):
              repo_path = os.path.join(clone_base, f"repo_{i}")
              print(f"[*] Klone Repository: {repo_url} ...")
              try:
                  subprocess.run(["git", "clone", "--depth", "1", repo_url, repo_path], check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              except Exception as e:
                  print(f"[-] Fehler beim Klonen von {repo_url}: {e}")
                  continue

              for root, dirs, files in os.walk(repo_path):
                  if "rk915_cal.bin" in files and not found_cal:
                      src = os.path.join(root, "rk915_cal.bin")
                      shutil.copy2(src, os.path.join(firmware_dir, "rk915_cal.bin"))
                      print("[✓] rk915_cal.bin erfolgreich aus Repo extrahiert!")
                      found_cal = True

                  if "rk915_rf_para.txt" in files and not found_para:
                      src = os.path.join(root, "rk915_rf_para.txt")
                      shutil.copy2(src, os.path.join(firmware_dir, "rk915_rf_para.txt"))
                      print("[✓] rk915_rf_para.txt erfolgreich aus Repo extrahiert!")
                      found_para = True

              if found_cal and found_para:
                  break

          # 2. Direkter Fallback über bekannte direkte Raw-Quellen, falls nötig
          if not found_cal or not found_para:
              print("[*] Nutze direkte Quell-URLs als Fallback...")
              direct_urls = {
                  "rk915_cal.bin": [
                      "https://raw.githubusercontent.com/lcdyk0517/arkos4clone/main/drivers/wifi/rk915/rk915_cal.bin",
                      "https://raw.githubusercontent.com/AeolusUX/ArkOS-R3XS/main/drivers/wifi/rk915/rk915_cal.bin"
                  ],
                  "rk915_rf_para.txt": [
                      "https://raw.githubusercontent.com/lcdyk0517/arkos4clone/main/drivers/wifi/rk915/rk915_rf_para.txt",
                      "https://raw.githubusercontent.com/AeolusUX/ArkOS-R3XS/main/drivers/wifi/rk915/rk915_rf_para.txt"
                  ]
              }

              for fname, urls in direct_urls.items():
                  dest_path = os.path.join(firmware_dir, fname)
                  if fname == "rk915_cal.bin" and found_cal: continue
                  if fname == "rk915_rf_para.txt" and found_para: continue

                  for url in urls:
                      try:
                          print(f"[*] Lade {fname} von {url} ...")
                          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                          with urllib.request.urlopen(req) as response, open(dest_path, 'wb') as out_file:
                              out_file.write(response.read())
                          if os.path.exists(dest_path) and os.path.getsize(dest_path) > 10:
                              print(f"[✓] {fname} erfolgreich geladen!")
                              if fname == "rk915_cal.bin": found_cal = True
                              if fname == "rk915_rf_para.txt": found_para = True
                              break
                      except Exception as e:
                          print(f"[-] Download fehlgeschlagen: {e}")

          if not found_cal or not found_para:
              raise RuntimeError("[!] Fehler: Die echten Firmware-Dateien konnten nicht ermittelt werden.")

          # 3. Dynamisches .sh Installationsskript erstellen (vollständig ohne Platzhalter)
          sh_script_path = os.path.join(output_dir, "install_wifi.sh")
          sh_content = """#!/bin/bash
          # ==========================================
          # M9 Pro RK915 WiFi Auto-Installer Skript
          # ==========================================

          if [ "$EUID" -ne 0 ]; then
            echo "[-] Bitte starte das Skript mit Root-Rechten (sudo ./install_wifi.sh)!"
            exit 1
          fi

          echo "[*] Starte WLAN-Installation für M9 Pro..."
          
          # Partition beschreibbar machen
          mount -o remount,rw / 2>/dev/null || true

          # Zielordner anlegen
          mkdir -p /lib/firmware

          # Dateien kopieren
          if [ -d "./lib/firmware" ]; then
              cp -v ./lib/firmware/rk915_cal.bin /lib/firmware/
              cp -v ./lib/firmware/rk915_rf_para.txt /lib/firmware/
          elif [ -f "./rk915_cal.bin" ] && [ -f "./rk915_rf_para.txt" ]; then
              cp -v ./rk915_cal.bin /lib/firmware/
              cp -v ./rk915_rf_para.txt /lib/firmware/
          else
              echo "[-] Fehler: Firmware-Dateien nicht gefunden!"
              exit 1
          fi

          # Rechte korrigieren
          chmod 644 /lib/firmware/rk915_cal.bin
          chmod 644 /lib/firmware/rk915_rf_para.txt

          echo "[*] Initialisiere RK915 Kernel-Modul..."
          modprobe -r rk915 2>/dev/null || true
          modprobe rk915 2>/dev/null || true

          echo "=========================================="
          echo "[✓] Installation erfolgreich abgeschlossen!"
          echo "Bitte starte das M9 Pro jetzt einmal neu."
          echo "=========================================="
          """

          with open(sh_script_path, "w", encoding="utf-8") as f:
              f.write(sh_content)
          
          os.chmod(sh_script_path, 0o755)
          print("[✓] Installations-Skript 'install_wifi.sh' fehlerfrei generiert.")
          EOF

      - name: Paket als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: m9pro-wifi-complete-kit
          path: wifi_package/
          retention-days: 7
