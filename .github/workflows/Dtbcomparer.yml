name: DTB RAM Analysis (All Files)

on:
  workflow_dispatch:

jobs:
  analyze-all-dtbs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install DTC
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler

      - name: Decompile and Compare All DTBs
        run: |
          python3 - << 'EOF'
          import subprocess
          import re
          import os

          # Liste der Dateien basierend auf deinem Repository-Bild
          FILES_TO_CHECK = [
              "rg32tw3ka.dtb",                # Stock EmuELEC
              "rk3326-k36-linux.dtb",         # K36
              "rk3326-k36s-linux.dtb",        # K36S
              "rk3326-m9pro-linux.dtb",       # Aktuelle ArkOS DTB
              "rk3326-r36tmax-linux.dtb"      # R36TMax
          ]
          
          OUTPUT_LOG = "all_dtb_comparison.txt"
          log = "==================================================\n"
          log += "   DTB FULL RAM ANALYSIS (All Devices)\n"
          log += "==================================================\n\n"

          def clean_block(block):
              """Entfernt übermäßige Leerzeilen und Tabs für bessere Lesbarkeit"""
              lines = [line.strip() for line in block.split('\n') if line.strip()]
              return '\n    '.join(lines)

          def analyze_file(dtb_name):
              res_log = f"--- Analyzing {dtb_name} ---\n"
              if not os.path.exists(dtb_name):
                  return res_log + "[!] File not found. Skipped.\n\n"
              
              dts_name = dtb_name + ".dts"
              try:
                  subprocess.run(["dtc", "-I", "dtb", "-O", "dts", "-o", dts_name, dtb_name], 
                                 capture_output=True, check=True)
              except subprocess.CalledProcessError:
                  return res_log + "[!] Failed to decompile. Invalid DTB?\n\n"

              with open(dts_name, "r") as f:
                  text = f.read()
              
              # 1. Memory Node
              mem_match = re.search(r'(memory\s*\{.*?\n\t\};)', text, re.DOTALL)
              if mem_match:
                  res_log += "[+] Memory Node:\n    " + clean_block(mem_match.group(1)) + "\n\n"
              else:
                  res_log += "[!] No 'memory' node found.\n\n"

              # 2. Reserved Memory
              res_match = re.search(r'(reserved-memory\s*\{.*?\n\t\};)', text, re.DOTALL)
              if res_match:
                  res_log += "[+] Reserved Memory:\n    " + clean_block(res_match.group(1)) + "\n\n"
              else:
                  res_log += "[!] No 'reserved-memory' block found.\n\n"

              # 3. Chosen Node (Bootargs)
              chosen_match = re.search(r'(chosen\s*\{.*?\n\t\};)', text, re.DOTALL)
              if chosen_match:
                  res_log += "[+] Chosen Node (Bootargs):\n    " + clean_block(chosen_match.group(1)) + "\n\n"
              else:
                  res_log += "[!] No 'chosen' node found.\n\n"

              return res_log

          for file in FILES_TO_CHECK:
              log += analyze_file(file)

          with open(OUTPUT_LOG, "w") as f:
              f.write(log)
          print(f"[*] Analysis complete. Log size: {len(log)} bytes.")
          EOF

      - name: Upload Comparison Log
        uses: actions/upload-artifact@v4
        with:
          name: all-dtb-comparison-log
          path: all_dtb_comparison.txt
