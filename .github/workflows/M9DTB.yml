name: Build M9 Pro DTB for ArkOS4Clones

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-dtb:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install DTC & Python
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler python3

      - name: Patch M9 Pro DTB with Joystick RGB LED Controls
        run: |
          python3 - << 'EOF'
          import re, subprocess, os

          # Target your working M9 Pro DTB directly as the base
          BASE_DTB = "rk3326-m9pro-linux.dtb"
          DONOR_DTB = "rk3326-k36-linux.dtb"
          OUTPUT_DTB = "rk3326-m9pro-linux.dtb.patched"

          if not os.path.exists(BASE_DTB):
              print(f"[!] Error: Base working DTB '{BASE_DTB}' not found in repo root!")
              exit(1)

          if not os.path.exists(DONOR_DTB):
              print(f"[!] Error: Donor DTB '{DONOR_DTB}' not found in repo root!")
              exit(1)

          print(f"[*] Decompiling base ({BASE_DTB}) and donor ({DONOR_DTB})...")
          subprocess.run(["dtc", "-I", "dtb", "-O", "dts", "-f", "-o", "base.dts", BASE_DTB], check=True)
          subprocess.run(["dtc", "-I", "dtb", "-O", "dts", "-f", "-o", "donor.dts", DONOR_DTB], check=True)

          with open("base.dts", "r", encoding="utf-8") as f: base_dts = f.read()
          with open("donor.dts", "r", encoding="utf-8") as f: donor_dts = f.read()

          def find_node_boundaries(dts_content, node_name):
              pattern = re.compile(r'(?:^[ \t]*|[ \t]+)([a-zA-Z0-9_-]+:\s*)?' + re.escape(node_name) + r'(?:@[a-zA-Z0-9_,+-]+)?\s*\{', re.MULTILINE)
              match = pattern.search(dts_content)
              if not match:
                  return None, None
              start_idx = match.start()
              brace_idx = dts_content.find('{', start_idx)
              brace_count = 1
              for i in range(brace_idx + 1, len(dts_content)):
                  if dts_content[i] == '{': brace_count += 1
                  elif dts_content[i] == '}': brace_count -= 1
                  if brace_count == 0:
                      end_idx = i + 1
                      if end_idx < len(dts_content) and end_idx == ';': 
                          end_idx += 1
                      return start_idx, end_idx
              return None, None

          def extract_exact_node(dts_content, node_name):
              start, end = find_node_boundaries(dts_content, node_name)
              if start is not None and end is not None:
                  return dts_content[start:end].strip()
              return None

          def purge_node(text, node_name):
              while True:
                  start, end = find_node_boundaries(text, node_name)
                  if start is None: break
                  text = text[:start] + text[end:]
              return text

          print("[*] Analyzing and extracting joystick RGB LED controller / zed nodes from K36...")
          # Target specific ArkOS LED / joystick controller strings including zed / zed_gadget / zed_service variants
          target_led_nodes = [
              "play_joystick", "zed", "zed_gadget", "zed_service", 
              "rgb-led", "rgb_led", "joystick_led", "led_ring", 
              "pwm-leds", "pwm_leds", "gpio-leds", "gpio_leds"
          ]

          extracted_nodes = []
          for node in target_led_nodes:
              block = extract_exact_node(donor_dts, node)
              if block:
                  extracted_nodes.append((node, block))
                  print(f"[+] Found joystick LED / zed control node in donor DTB: {node}")

          # Build phandle map for safe injection matching
          def build_phandle_map(dts_content):
              pmap = {}
              for match in re.finditer(r'(?:linux,phandle|phandle)\s*=\s*<(0x[0-9a-fA-F]+)>;', dts_content):
                  ph_val = match.group(1)
                  text_before = dts_content[:match.start()]
                  brace_idx = text_before.rfind('{')
                  if brace_idx != -1:
                      node_decl = text_before[:brace_idx].strip().split('\n')[-1].strip()
                      node_name = node_decl.split(':')[-1].strip().split()[0]
                      pmap[node_name] = ph_val
              return pmap

          base_map = build_phandle_map(base_dts)
          donor_map = build_phandle_map(donor_dts)
          translation = {ph: base_map[n] for n, ph in donor_map.items() if n in base_map}

          target_phandles = set(int(m.group(1), 16) for m in re.finditer(r'(?:linux,phandle|phandle)\s*=\s*<(0x[0-9a-fA-F]+)>;', base_dts))
          new_ph_counter = max(target_phandles) + 1 if target_phandles else 0x1000
          internal_ph_map = {}

          injected_blocks = []
          for name, block in extracted_nodes:
              base_dts = purge_node(base_dts, name)
              for src_ph, tgt_ph in translation.items():
                  block = re.sub(r'\b' + src_ph + r'\b', tgt_ph, block)
              for m in re.finditer(r'(?:linux,phandle|phandle)\s*=\s*<(0x[0-9a-fA-F]+)>;', block):
                  old_ph = m.group(1).lower()
                  if old_ph not in internal_ph_map:
                      internal_ph_map[old_ph] = f"0x{new_ph_counter:x}"
                      new_ph_counter += 1
                  block = re.sub(r'\b' + old_ph + r'\b', internal_ph_map[old_ph], block)
              injected_blocks.append(block)

          if injected_blocks:
              last_brace = base_dts.rfind("};")
              if last_brace != -1:
                  insert = "\n\t/* --- INJECTED JOYSTICK RGB LED / ZED NODES --- */\n"
                  for block in injected_blocks:
                      insert += "\t" + block.replace("\n", "\n\t") + "\n\n"
                  insert += "\t/* --- END INJECTED JOYSTICK RGB LED / ZED NODES --- */\n"
                  base_dts = base_dts[:last_brace] + insert + base_dts[last_brace:]

          print("[*] Enforcing internal device name to 'm9pro'...")
          base_dts = re.sub(r'model\s*=\s*"[^"]*";', 'model = "m9pro";', base_dts, count=1)

          with open("merged.dts", "w", encoding="utf-8") as f:
              f.write(base_dts)

          print(f"[*] Compiling final patched DTB ({OUTPUT_DTB})...")
          subprocess.run(["dtc", "-I", "dts", "-O", "dtb", "-f",
                          "-Wno-unique_unit_address", "-Wno-graph_child_address",
                          "-o", OUTPUT_DTB, "merged.dts"], check=True)

          # Verification output log
          decompile(OUTPUT_DTB, "verify.dts")
          with open("verify.dts", "r", encoding="utf-8") as f: final_text = f.read()

          log = [
              "==================================================",
              "      M9 PRO JOYSTICK RGB LED / ZED PATCH LOG",
              "==================================================",
              f"Output File: {OUTPUT_DTB}",
              f"Internal Model Name: {'m9pro' if 'model = \"m9pro\";' in final_text else 'MISSING'}",
              "[+] Injected LED/Zed nodes:"
          ]
          for name, _ in extracted_nodes:
              log.append(f"  - {name}: {'OK' if name in final_text else 'MISSING'}")

          log_text = "\n".join(log)
          with open("patch_verification.log", "w", encoding="utf-8") as f: f.write(log_text)
          print(log_text)
          print("[✓] Patch completed successfully!")
          EOF

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m9pro-patched-dtb
          path: |
            rk3326-m9pro-linux.dtb.patched
            patch_verification.log
          retention-days: 14

      - name: Commit and Push (force)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rk3326-m9pro-linux.dtb.patched patch_verification.log
          git diff --quiet && git diff --staged --quiet || git commit -m "fix(dtb): inject joystick rgb led and zed controller nodes into m9pro dtb [skip ci]"
          git push --force origin main
