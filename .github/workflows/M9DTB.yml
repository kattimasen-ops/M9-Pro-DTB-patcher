name: Build M9 Pro DTB for ArkOS4Clones

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-dtb:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install DTC & Python
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler python3

      - name: Build M9 Pro DTB
        run: |
          python3 - << 'EOF'
          import re, subprocess, os

          # Input DTBs (must exist in repo)
          STOCK_DTB = "rg32tw3ka.dtb"           # your stock EmuELEC DTB
          K36_DTB   = "rk3326-k36-linux.dtb"   # ArkOS4Clones K36 DTB
          OUTPUT_DTB = "rk3326-m9-4clones.dtb"

          # ---- Helper functions ----

          def decompile(dtb_path, dts_path):
              subprocess.run(["dtc", "-I", "dtb", "-O", "dts", "-f", "-o", dts_path, dtb_path], check=True)

          def build_phandle_map(dts_content):
              """Return dict {node_name: phandle_string} from the DTS."""
              pmap = {}
              for match in re.finditer(r'(?:linux,phandle|phandle)\s*=\s*<(0x[0-9a-f]+)>;', dts_content):
                  ph_val = match.group(1)
                  text_before = dts_content[:match.start()]
                  brace_idx = text_before.rfind('{')
                  if brace_idx != -1:
                      node_decl = text_before[:brace_idx].strip().split('\n')[-1].strip()
                      node_name = node_decl.split(':')[-1].strip().split()[0]
                      pmap[node_name] = ph_val
              return pmap

          def purge_node(text, node_name):
              """Remove a node definition from DTS text."""
              while True:
                  pattern = r'\n[ \t]*' + re.escape(node_name) + r'(?:@[a-zA-Z0-9_,+-]+)?\s*\{'
                  match = re.search(pattern, text)
                  if not match: break
                  start_idx = match.start()
                  brace_idx = text.find('{', start_idx)
                  if brace_idx == -1: break
                  brace_count = 1
                  end_idx = -1
                  for i in range(brace_idx + 1, len(text)):
                      if text[i] == '{': brace_count += 1
                      elif text[i] == '}': brace_count -= 1
                      if brace_count == 0:
                          end_idx = i + 1
                          if end_idx < len(text) and text[end_idx] == ';': end_idx += 1
                          break
                  if end_idx != -1:
                      text = text[:start_idx] + text[end_idx:]
                  else: break
              return text

          def extract_exact_node(dts_content, node_name):
              """Extract the complete block for a given node name (root-level)."""
              pattern = r'\n[ \t]*' + re.escape(node_name) + r'(?:@[a-zA-Z0-9_,+-]+)?\s*\{'
              match = re.search(pattern, dts_content)
              if not match:
                  return None
              start_idx = match.start()
              brace_idx = dts_content.find('{', start_idx)
              if brace_idx == -1:
                  return None
              brace_count = 1
              end_idx = -1
              for i in range(brace_idx + 1, len(dts_content)):
                  if dts_content[i] == '{': brace_count += 1
                  elif dts_content[i] == '}': brace_count -= 1
                  if brace_count == 0:
                      end_idx = i + 1
                      if end_idx < len(dts_content) and dts_content[end_idx] == ';': end_idx += 1
                      break
              if end_idx == -1:
                  return None
              return dts_content[start_idx:end_idx].strip()

          def inject_nodes(target_dts, source_nodes, source_phandle_map, target_phandle_map, target_dts_content):
              """Inject source_nodes (list of (name, block)) into target_dts_content with phandle translation."""
              translation = {}
              for name, ph in source_phandle_map.items():
                  if name in target_phandle_map:
                      translation[ph] = target_phandle_map[name]

              # Renumber internal phandles to avoid collisions
              target_phandles = set()
              for m in re.finditer(r'(?:linux,phandle|phandle)\s*=\s*<(0x[0-9a-fA-F]+)>;', target_dts_content):
                  target_phandles.add(int(m.group(1), 16))
              new_ph_counter = max(target_phandles) + 1 if target_phandles else 0x1000

              internal_ph_map = {}
              injected_blocks = []

              # Purge any existing nodes with same names
              for name, _ in source_nodes:
                  target_dts_content = purge_node(target_dts_content, name)

              for name, block in source_nodes:
                  # Translate phandles in the block
                  for src_ph, tgt_ph in translation.items():
                      block = re.sub(r'\b' + src_ph + r'\b', tgt_ph, block)

                  # Assign a new internal phandle if the block has one
                  for m in re.finditer(r'(?:linux,phandle|phandle)\s*=\s*<(0x[0-9a-fA-F]+)>;', block):
                      old_ph = m.group(1).lower()
                      if old_ph not in internal_ph_map:
                          internal_ph_map[old_ph] = f"0x{new_ph_counter:x}"
                          new_ph_counter += 1
                      block = re.sub(r'\b' + old_ph + r'\b', internal_ph_map[old_ph], block)

                  injected_blocks.append(block)

              if not injected_blocks:
                  return target_dts_content

              # Insert before the closing root brace
              last_brace = target_dts_content.rfind("};")
              if last_brace == -1:
                  return target_dts_content

              insert = "\n\t/* --- INJECTED NODES --- */\n"
              for block in injected_blocks:
                  insert += "\t" + block.replace("\n", "\n\t") + "\n\n"
              insert += "\t/* --- END INJECTED NODES --- */\n"

              return target_dts_content[:last_brace] + insert + target_dts_content[last_brace:]

          def apply_teacupx_oc(dts_content):
              """
              Add a full step‑by‑step CPU, GPU and RAM overclocking ladder.
              Frequencies are inserted only if they don't already exist.
              Existing disabled OPPs are enabled (remove 'status = "disabled";').
              """
              # Helper to insert OPPs into a given OPP table node (robust version)
              def insert_opps(dts, node_name, opp_list):
                  """
                  opp_list: list of (freq_hz, microvolt) tuples.
                  microvolt can be None for RAM (voltage not used).
                  """
                  # Locate the OPP table node using a more reliable method
                  pattern = r'\n[ \t]*(' + re.escape(node_name) + r'\s*\{)'
                  match = re.search(pattern, dts)
                  if not match:
                      return dts
                  node_start = match.start()
                  # Find the matching closing brace
                  brace_count = 1
                  idx = dts.find('{', node_start)
                  if idx == -1:
                      return dts
                  idx += 1
                  while idx < len(dts) and brace_count > 0:
                      if dts[idx] == '{':
                          brace_count += 1
                      elif dts[idx] == '}':
                          brace_count -= 1
                      idx += 1
                  if brace_count != 0:
                      return dts
                  node_end = idx
                  node_content = dts[node_start:node_end]

                  # Remove any 'status = "disabled";' lines inside the node
                  node_content_clean = re.sub(r'\n[ \t]*status\s*=\s*"disabled";', '', node_content)

                  # Extract all existing OPP entries as blocks
                  # We'll find each 'opp-<freq> {' block and extract it
                  # A more robust way: find all entries that end with '};'
                  opp_blocks = []
                  # Regex to find an OPP entry: starts with opp-<freq> { ... };
                  # We'll scan for 'opp-' and extract the block
                  pos = 0
                  while True:
                      # Find next 'opp-' occurrence
                      opp_start = node_content_clean.find('\n\t\topp-', pos)
                      if opp_start == -1:
                          break
                      # Find the opening brace after that
                      brace_idx = node_content_clean.find('{', opp_start)
                      if brace_idx == -1:
                          break
                      # Find matching closing brace
                      cnt = 1
                      idx2 = brace_idx + 1
                      while idx2 < len(node_content_clean) and cnt > 0:
                          if node_content_clean[idx2] == '{':
                              cnt += 1
                          elif node_content_clean[idx2] == '}':
                              cnt -= 1
                          idx2 += 1
                      if cnt != 0:
                          break
                      # The entry ends at idx2
                      entry = node_content_clean[opp_start:idx2].strip()
                      opp_blocks.append(entry)
                      pos = idx2

                  # Extract existing opp-hz lines to avoid duplicates
                  existing_opp_hz = set()
                  for entry in opp_blocks:
                      for m in re.finditer(r'opp-hz\s*=\s*<[^>]+>;', entry):
                          existing_opp_hz.add(m.group(0))

                  # Build new OPP entries that are not already present
                  new_entries = []
                  for freq_hz, volt in opp_list:
                      freq_hex = f"0x{freq_hz:x}"
                      opp_hz_line = f"opp-hz = < 0x00 {freq_hex} >;"
                      if opp_hz_line in existing_opp_hz:
                          continue
                      if volt:
                          opp_entry = f"\t\topp-{freq_hz} {{ {opp_hz_line} opp-microvolt = < {volt} >; }};"
                      else:
                          opp_entry = f"\t\topp-{freq_hz} {{ {opp_hz_line} }};"
                      new_entries.append(opp_entry)

                  if not new_entries:
                      # Only need to remove disabled status
                      return dts[:node_start] + node_content_clean + dts[node_end:]

                  # Insert new entries before the closing brace of the node
                  # Find the last '}' before the end
                  last_brace_pos = node_content_clean.rfind('}')
                  if last_brace_pos == -1:
                      return dts
                  insertion = "\n" + "\n".join(new_entries)
                  # Insert after the last '}'? Actually we want to insert before the closing brace,
                  # so we replace the node content with the cleaned content and new entries inserted
                  # at the position of the last '}'.
                  new_node_content = node_content_clean[:last_brace_pos] + insertion + node_content_clean[last_brace_pos:]
                  return dts[:node_start] + new_node_content + dts[node_end:]

              # ---- CPU OPPs (frequencies in Hz, voltage in microvolts) ----
              # Stock already has: 1008, 1104, 1200, 1248, 1296, 1416, 1512
              # We add extra steps: 1392, 1488, and enable 1512.
              cpu_opps = [
                  (1392000000, 1300000),   # 1.392 GHz
                  (1488000000, 1325000),   # 1.488 GHz
                  (1512000000, 1350000),   # 1.512 GHz (enable existing)
              ]
              dts_content = insert_opps(dts_content, "cpu0_opp_table", cpu_opps)

              # ---- GPU OPPs ----
              # Stock has up to 520MHz; add 600, 667, 700, 800
              gpu_opps = [
                  (600000000, 1100000),   # 600 MHz
                  (667000000, 1150000),   # 667 MHz
                  (700000000, 1200000),   # 700 MHz
                  (800000000, 1250000),   # 800 MHz
              ]
              dts_content = insert_opps(dts_content, "gpu_opp_table", gpu_opps)

              # ---- RAM (DMC) OPPs ----
              # Stock has up to 786MHz; add 933 and 1056
              dmc_opps = [
                  (933000000, None),      # 933 MHz
                  (1056000000, None),     # 1056 MHz
              ]
              dts_content = insert_opps(dts_content, "dmc_opp_table", dmc_opps)

              return dts_content

          # ---- Main ----

          # 1. Check inputs
          for f in [STOCK_DTB, K36_DTB]:
              if not os.path.exists(f):
                  print(f"[!] Missing {f}")
                  exit(1)

          # 2. Decompile all
          print("[*] Decompiling DTBs...")
          decompile(STOCK_DTB, "stock.dts")
          decompile(K36_DTB, "k36.dts")

          with open("k36.dts", "r", encoding="utf-8") as f:
              base_dts = f.read()

          with open("stock.dts", "r", encoding="utf-8") as f:
              stock_dts = f.read()

          # 3. Build phandle maps
          print("[*] Building phandle maps...")
          stock_map = build_phandle_map(stock_dts)
          k36_map   = build_phandle_map(base_dts)

          # 4. Extract the four exact nodes from stock DTB
          print("[*] Extracting exact nodes: play_joystick, led-vcc, wireless-wlan, sdio-pwrseq...")
          exact_nodes = ["play_joystick", "led-vcc", "wireless-wlan", "sdio-pwrseq"]
          source_nodes = []
          for node in exact_nodes:
              block = extract_exact_node(stock_dts, node)
              if block:
                  source_nodes.append((node, block))
                  print(f"[+] Found node: {node}")
              else:
                  print(f"[!] WARNING: Node '{node}' not found in stock DTB!")

          if not source_nodes:
              print("[!] No nodes to inject. Aborting.")
              exit(1)

          # 5. Inject nodes into K36 base
          print("[*] Injecting nodes...")
          base_dts = inject_nodes(base_dts, source_nodes, stock_map, k36_map, base_dts)

          # 6. Apply overclocking
          print("[*] Applying step‑by‑step overclocking...")
          base_dts = apply_teacupx_oc(base_dts)

          # 7. Write merged DTS and compile
          with open("merged.dts", "w", encoding="utf-8") as f:
              f.write(base_dts)

          print("[*] Compiling final DTB...")
          subprocess.run(["dtc", "-I", "dts", "-O", "dtb", "-f",
                          "-Wno-unique_unit_address", "-Wno-graph_child_address",
                          "-o", OUTPUT_DTB, "merged.dts"], check=True)

          # 8. Verification
          print("[*] Verifying final DTB...")
          decompile(OUTPUT_DTB, "verify.dts")
          with open("verify.dts", "r", encoding="utf-8") as f:
              final_dts = f.read()

          log = []
          log.append("==================================================")
          log.append("      M9 PRO DTB PATCH & OVERCLOCK VERIFICATION")
          log.append("==================================================")

          # Check injected nodes
          log.append("[+] Injected nodes:")
          for name, _ in source_nodes:
              found = name in final_dts
              log.append(f"  - {name}: {'OK' if found else 'MISSING'}")

          # Check OC frequencies
          log.append("[+] Overclocking profiles:")
          cpu_check = ["opp-1392000000", "opp-1488000000", "opp-1512000000"]
          gpu_check = ["opp-600000000", "opp-667000000", "opp-700000000", "opp-800000000"]
          dmc_check = ["opp-933000000", "opp-1056000000"]
          for prof in cpu_check + gpu_check + dmc_check:
              found = prof in final_dts
              log.append(f"  - {prof}: {'ACTIVE' if found else 'MISSING'}")

          log_text = "\n".join(log)
          with open("patch_verification.log", "w", encoding="utf-8") as f:
              f.write(log_text)
          print(log_text)

          print("[✓] DTB build completed successfully.")
          EOF

      - name: Upload DTB & Log
        uses: actions/upload-artifact@v4
        with:
          name: m9-pro-dtb
          path: |
            rk3326-m9-4clones.dtb
            patch_verification.log
          retention-days: 14

      - name: Commit and Push (with pull)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rk3326-m9-4clones.dtb patch_verification.log
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || git commit -m "build(dtb): automated M9 Pro DTB merge [skip ci]"
          # Pull remote changes and rebase local commits on top
          git pull --rebase origin main
          git push origin main
