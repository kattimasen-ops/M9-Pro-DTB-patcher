name: RK3326 DTB Diff, Merge & Overclock Patcher

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch-and-merge-dtb:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Device Tree Compiler (dtc)
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler python3 python3-git

      - name: Run Advanced DTB Decompilation, Diff & Merge Script
        run: |
          python3 - << 'EOF'
          import re
          import subprocess
          import os

          original_dtb = "rg32tw3ka.dtb"
          orig_dts = "original_decompiled.dts"
          target_dtb = "rk3326-k36s-linux.dtb"
          target_dts = "target_decompiled.dts"
          merged_dts = "merged.dts"
          final_dtb = "rk3326-k36s-linux.dtb"

          if not os.path.exists(original_dtb):
              raise FileNotFoundError(f"Original-DTB '{original_dtb}' wurde im Repository nicht gefunden!")

          print(f"[*] Dekompiliere Original-DTB ({original_dtb})...")
          subprocess.run(["dtc", "-I", "dtb", "-O", "dts", "-o", orig_dts, original_dtb], check=True)

          # Falls die Ziel-DTB existiert, dekompilieren wir sie als Basis für den Abgleich
          if os.path.exists(target_dtb):
              print(f"[*] Dekompiliere bestehende Ziel-DTB ({target_dtb})...")
              subprocess.run(["dtc", "-I", "dtb", "-O", "dts", "-o", target_dts, target_dtb], check=True)
              with open(target_dts, "r", encoding="utf-8") as f:
                  content = f.read()
          else:
              print(f"[*] Keine Ziel-DTB gefunden, verwende Original als Basis.")
              with open(orig_dts, "r", encoding="utf-8") as f:
                  content = f.read()

          with open(orig_dts, "r", encoding="utf-8") as f:
              orig_content = f.read()

          print("[*] Führe Struktur- und Pfadabgleich mit dem Original durch...")

          # 1. Korrigiere und aktualisiere SDIO-Status (Abgleich mit Original)
          orig_sdio_match = re.search(r'(sdio\s*\{[^}]*status\s*=\s*"[^"]+"\s*;?[^}]*\})', orig_content, re.DOTALL)
          if orig_sdio_match:
              content = re.sub(r'sdio\s*\{[^}]*status\s*=\s*"disabled"\s*;?[^}]*\}', orig_sdio_match.group(1), content, flags=re.DOTALL)
          
          content = re.sub(r'(sdio\s*\{[^}]*status\s*=\s*")disabled(";)', r'\1okay\2', content)

          # 2. Bereinige fehlerhafte Label-Referenzen im Root
          content = re.sub(r'&(?:cpu0_opp_table|gpu_opp_table|dmc_opp_table)\s*\{[^}]*\};\s*', '', content)

          # 3. Ergänze fehlende Hardware-Module (Analogstick LEDs, WLAN, Bluetooth)
          if "led_left_stick" not in content and "gpio-leds" not in content:
              led_node = """
          	/* TeacupX / M9Pro Hardware - Analogstick LEDs */
          	gpio-leds {
          		compatible = "gpio-leds";
          		pinctrl-names = "default";

          		stick_led_left {
          			label = "led_left_stick";
          			gpios = <&gpio3 0x08 0x00>;
          			default-state = "on";
          		};

          		stick_led_right {
          			label = "led_right_stick";
          			gpios = <&gpio3 0x09 0x00>;
          			default-state = "on";
          		};
          	};
          """
              last_brace = content.rfind("};")
              if last_brace != -1:
                  content = content[:last_brace] + led_node + "\n" + content[last_brace:]

          if "wireless-wlan" not in content and "wlan-platdata" not in content:
              wifi_node = """
          	/* TeacupX Hardware - Wireless WLAN */
          	wireless_wlan: wireless-wlan {
          		compatible = "wlan-platdata";
          		wifi_chip_type = "generic";
          		status = "okay";
          	};
          """
              last_brace = content.rfind("};")
              if last_brace != -1:
                  content = content[:last_brace] + wifi_node + "\n" + content[last_brace:]

          if "wireless-bluetooth" not in content and "bluetooth-platdata" not in content:
              bt_node = """
          	/* TeacupX Hardware - Wireless Bluetooth */
          	wireless_bluetooth: wireless-bluetooth {
          		compatible = "bluetooth-platdata";
          		wifi-bt-power-toggle;
          		status = "okay";
          	};
          """
              last_brace = content.rfind("};")
              if last_brace != -1:
                  content = content[:last_brace] + bt_node + "\n" + content[last_brace:]

          # 4. TeacupX Overclocking-Einträge (CPU, GPU, RAM) einfügen
          cpu_oc = """
          		opp-1300000000 {
          			opp-hz = < 0x00 0x4d784000 >;
          			opp-microvolt = < 0x1406f0 >;
          		};
          		opp-1416000000 {
          			opp-hz = < 0x00 0x5463b000 >;
          			opp-microvolt = < 0x14fb18 >;
          		};
          		opp-1512000000 {
          			opp-hz = < 0x00 0x5a1f4000 >;
          			opp-microvolt = < 0x155cc0 >;
          		};"""

          if "opp-1300000000" not in content:
              m = re.search(r'(opp-(?:1200000000|1100000000|1000000000|312000000)\s*\{[^}]*\};)', content)
              if m:
                  pos = m.end()
                  content = content[:pos] + "\n" + cpu_oc + content[pos:]

          gpu_oc = """
          		opp-667000000 {
          			opp-hz = < 0x00 0x27c95b00 >;
          			opp-microvolt = < 0x13d620 >;
          		};
          		opp-700000000 {
          			opp-hz = < 0x00 0x29b92700 >;
          			opp-microvolt = < 0x1406f0 >;
          		};
          		opp-800000000 {
          			opp-hz = < 0x00 0x2fa0be00 >;
          			opp-microvolt = < 0x14f000 >;
          		};"""

          if "opp-700000000" not in content:
              m = re.search(r'(opp-(?:520000000|600000000|400000000|200000000)\s*\{[^}]*\};)', content)
              if m:
                  pos = m.end()
                  content = content[:pos] + "\n" + gpu_oc + content[pos:]

          dmc_oc = """
          		opp-933000000 {
          			opp-hz = < 0x00 0x379c29c0 >;
          		};
          		opp-1056000000 {
          			opp-hz = < 0x00 0x3ef14800 >;
          		};"""

          if "opp-1056000000" not in content:
              m = re.search(r'(opp-786000000\s*\{[^}]*\};|opp-667000000\s*\{[^}]*\};|dmc-opp-table\s*\{)', content)
              if m:
                  pos = m.end()
                  content = content[:pos] + "\n" + dmc_oc + content[pos:]

          with open(merged_dts, "w", encoding="utf-8") as f:
              f.write(content)

          print(f"[*] Kompiliere gemergte DTS zurück nach {final_dtb}...")
          subprocess.run(["dtc", "-I", "dts", "-O", "dtb", "-f", "-o", final_dtb, merged_dts], check=True)
          print("[✓] DTB erfolgreich abgeglichen, gepatcht und kompiliert!")
          EOF

      - name: Upload Generated DTB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: patched-rk3326-dtb
          path: rk3326-k36s-linux.dtb
          retention-days: 14

      - name: Commit and Push Updated DTB back to Repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rk3326-k36s-linux.dtb
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-diff, merge and patch rk3326-k36s-linux.dtb using original rg32tw3ka.dtb [skip ci]" && git push)
