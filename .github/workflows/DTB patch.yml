name: MASTER MODE - RK3326 DTB AI Phandle & Self-Healing

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  master-patch-dtb:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Device Tree Compiler & Python
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler python3 python3-git

      - name: Execute Self-Healing DTS Patcher & Full OC with Verification
        run: |
          python3 - << 'EOF'
          import re
          import subprocess
          import os

          original_dtb = "rg32tw3ka.dtb"
          target_dtb = "rk3326-k36-linux.dtb"
          orig_dts = "original_decompiled.dts"
          target_dts = "target_decompiled.dts"
          merged_dts = "merged.dts"
          final_dtb = "rk3326-k36-linux.dtb"

          if not os.path.exists(original_dtb):
              print(f"[!] FEHLER: Original-DTB '{original_dtb}' fehlt!")
              exit(1)

          print(f"[*] Dekompiliere Original-DTB ({original_dtb})...")
          subprocess.run(["dtc", "-I", "dtb", "-O", "dts", "-f", "-o", orig_dts, original_dtb], check=True)

          if os.path.exists(target_dtb):
              print(f"[*] Dekompiliere Ziel-DTB ({target_dtb})...")
              subprocess.run(["dtc", "-I", "dtb", "-O", "dts", "-f", "-o", target_dts, target_dtb], check=True)
          else:
              subprocess.run(["cp", orig_dts, target_dts], check=True)

          with open(target_dts, "r", encoding="utf-8") as f:
              content = f.read()

          with open(orig_dts, "r", encoding="utf-8") as f:
              orig_content = f.read()

          print("[*] AKTIVIERE SELBSTHEILUNG: Bereinige kaputte Duplikate...")
          content = re.sub(r'\n\t/\* --- START INJECTED M9PRO HARDWARE NODES --- \*/.*?/\* --- END INJECTED M9PRO HARDWARE NODES --- \*/\n', '', content, flags=re.DOTALL)

          def purge_node(text, node_name):
              while True:
                  match = re.search(r'\n[ \t]*' + re.escape(node_name) + r'(?:@[a-zA-Z0-9_,+-]+)?\s*\{', text)
                  if not match: break
                  start_idx = match.start()
                  brace_idx = text.find('{', start_idx)
                  if brace_idx == -1: break
                  brace_count = 1
                  end_idx = -1
                  for i in range(brace_idx + 1, len(text)):
                      if text[i] == '{': brace_count += 1
                      elif text[i] == '}': brace_count -= 1
                      if brace_count == 0:
                          end_idx = i + 1
                          if end_idx < len(text) and text[end_idx] == ';': end_idx += 1
                          break
                  if end_idx != -1:
                      text = text[:start_idx] + text[end_idx:]
                  else: break
              return text

          nodes_to_purge = ["sdio-pwrseq", "vcc-led", "ledvcc-en-gpio", "charge-led-gpio", "wifi-enable-h", "led-vcc", "gpio-leds", "led"]
          for node in nodes_to_purge:
              content = purge_node(content, node)

          print("[*] Baue dynamisches Phandle-Wörterbuch zur Hardware-Übersetzung auf...")
          def build_phandle_map(dts_content):
              pmap = {}
              for match in re.finditer(r'(?:linux,phandle|phandle)\s*=\s*<(0x[0-9a-f]+)>;', dts_content):
                  ph_val = match.group(1)
                  text_before = dts_content[:match.start()]
                  brace_idx = text_before.rfind('{')
                  if brace_idx != -1:
                      node_decl = text_before[:brace_idx].strip().split('\n')[-1].strip()
                      node_name = node_decl.split(':')[-1].strip().split()[0]
                      pmap[node_name] = ph_val
              return pmap

          orig_map = build_phandle_map(orig_content)
          target_map = build_phandle_map(content)

          translation_dict = {}
          for name, orig_ph in orig_map.items():
              if name in target_map:
                  translation_dict[orig_ph] = target_map[name]

          print(f"[*] {len(translation_dict)} Hardware-Phandles (externe Hardware) erfolgreich verknüpft!")

          def extract_root_nodes_by_keywords(text, keywords):
              extracted_blocks = []
              for match in re.finditer(r'^[ \t]*([a-zA-Z0-9_,+-]+)(?:@[a-zA-Z0-9_,+-]+)?\s*\{', text, re.MULTILINE):
                  decl = match.group(0)
                  node_name = match.group(1)
                  start_idx = match.start()
                  
                  if any(kw.lower() in decl.lower() for kw in keywords):
                      brace_count = 1
                      brace_idx = text.find('{', start_idx)
                      end_idx = -1
                      for j in range(brace_idx + 1, len(text)):
                          if text[j] == '{': brace_count += 1
                          elif text[j] == '}': brace_count -= 1
                          if brace_count == 0:
                              end_idx = j + 1
                              if end_idx < len(text) and text[end_idx] == ';': end_idx += 1
                              break
                      if end_idx != -1:
                          extracted_blocks.append((node_name, text[start_idx:end_idx].strip()))
              return extracted_blocks

          target_keywords = ["rgb", "pwm", "led", "light", "pcie", "pcim", "wlan", "wifi", "sdio", "rk915", "pwrseq"]
          found_nodes = extract_root_nodes_by_keywords(orig_content, target_keywords)

          print("[*] Generiere kollisionsfreie Phandles für injizierte Knoten...")
          target_phandles = set()
          for m in re.finditer(r'(?:linux,phandle|phandle)\s*=\s*<(0x[0-9a-fA-F]+)>;', content):
              target_phandles.add(int(m.group(1), 16))
          new_ph_counter = max(target_phandles) + 1 if target_phandles else 0x1000

          internal_phandle_map = {}
          for _, block in found_nodes:
              for m in re.finditer(r'(?:linux,phandle|phandle)\s*=\s*<(0x[0-9a-fA-F]+)>;', block):
                  old_ph = m.group(1).lower()
                  if old_ph not in internal_phandle_map:
                      internal_phandle_map[old_ph] = f"0x{new_ph_counter:x}"
                      new_ph_counter += 1

          injected_names = set()
          injections = "\n\t/* --- START INJECTED M9PRO HARDWARE NODES --- */\n"
          
          for node_name, block in found_nodes:
              clean_name = node_name.split('@')[0]
              
              if "battery" in clean_name.lower(): continue
              if clean_name.lower() in ["ledvcc-en-gpio", "charge-led-gpio", "wifi-enable-h"]:
                  continue
              if clean_name in injected_names: continue
              
              if re.search(r'\n[ \t]*' + re.escape(clean_name) + r'(?:@[a-zA-Z0-9_,+-]+)?\s*\{', content):
                  if "sdio" in clean_name.lower() or "pcie" in clean_name.lower():
                      content = re.sub(r'(' + re.escape(clean_name) + r'[^}]*status\s*=\s*")disabled(";)', r'\1okay\2', content)
                  continue
                  
              injected_names.add(clean_name)
              print(f"[+] Injiziere kollisionsfreien Node: {clean_name}")
              
              for orig_ph, targ_ph in translation_dict.items():
                  block = re.sub(r'\b' + orig_ph + r'\b', targ_ph, block, flags=re.IGNORECASE)
                  
              for old_internal, new_internal in internal_phandle_map.items():
                  block = re.sub(r'\b' + old_internal + r'\b', new_internal, block, flags=re.IGNORECASE)
                  
              injections += "\t" + block.replace("\n", "\n\t") + "\n\n"

          if injected_names:
              last_brace = content.rfind("};")
              if last_brace != -1:
                  injections += "\t/* --- END INJECTED M9PRO HARDWARE NODES --- */\n"
                  content = content[:last_brace] + injections + content[last_brace:]

          print("[*] Wende TeacupX Overclocking-Profile (CPU, GPU, RAM) an...")
          content = re.sub(r'&(?:cpu0_opp_table|gpu_opp_table|dmc_opp_table)\s*\{[^}]*\};\s*', '', content)
          content = re.sub(r'\s*opp-(?:1300000000|1416000000|1512000000|667000000|700000000|800000000|933000000|1056000000)\s*\{[^}]*?\};', '', content)

          cpu_oc = """
          		opp-1300000000 { opp-hz = < 0x00 0x4d784000 >; opp-microvolt = < 0x1406f0 >; };
          		opp-1416000000 { opp-hz = < 0x00 0x5463b000 >; opp-microvolt = < 0x14fb18 >; };
          		opp-1512000000 { opp-hz = < 0x00 0x5a1f4000 >; opp-microvolt = < 0x155cc0 >; };"""
          if m := re.search(r'(opp-(?:1200000000|1100000000|1000000000|312000000)\s*\{[^}]*\};)', content): content = content[:m.end()] + "\n" + cpu_oc + content[m.end():]

          gpu_oc = """
          		opp-667000000 { opp-hz = < 0x00 0x27c95b00 >; opp-microvolt = < 0x13d620 >; };
          		opp-700000000 { opp-hz = < 0x00 0x29b92700 >; opp-microvolt = < 0x1406f0 >; };
          		opp-800000000 { opp-hz = < 0x00 0x2fa0be00 >; opp-microvolt = < 0x14f000 >; };"""
          if m := re.search(r'(opp-(?:520000000|600000000|400000000|200000000)\s*\{[^}]*\};)', content): content = content[:m.end()] + "\n" + gpu_oc + content[m.end():]

          dmc_oc = """
          		opp-933000000 { opp-hz = < 0x00 0x379c29c0 >; };
          		opp-1056000000 { opp-hz = < 0x00 0x3ef14800 >; };"""
          if m := re.search(r'(opp-(?:786000000|667000000|528000000|333000000)\s*\{[^}]*\};)', content): content = content[:m.end()] + "\n" + dmc_oc + content[m.end():]

          with open(merged_dts, "w", encoding="utf-8") as f:
              f.write(content)

          print(f"[*] Kompiliere finale DTB ({final_dtb}) zurück...")
          subprocess.run(["dtc", "-I", "dts", "-O", "dtb", "-f", "-Wno-unique_unit_address", "-Wno-graph_child_address", "-o", final_dtb, merged_dts], check=True)

          # --- NEU: GEGENCHECK / VERIFIZIERUNG DER FINALEN DTB ---
          print("[*] Starte Gegencheck: Dekompiliere finale DTB zur Validierung...")
          verification_dts = "final_verification.dts"
          subprocess.run(["dtc", "-I", "dtb", "-O", "dts", "-f", "-o", verification_dts, final_dtb], check=True)

          with open(verification_dts, "r", encoding="utf-8") as f:
              final_compiled_content = f.read()

          log_lines = []
          log_lines.append("==================================================")
          log_lines.append("      M9 PRO DTB PATCH & OVERCLOCK VERIFICATION   ")
          log_lines.append("==================================================")
          log_lines.append(f"Target File: {final_dtb}")
          log_lines.append("")
          log_lines.append("[+] Überprüfung der injizierten Hardware-Knoten:")
          
          for name in sorted(injected_names):
              found = bool(re.search(r'\n[ \t]*' + re.escape(name) + r'(?:@[a-zA-Z0-9_,+-]+)?\s*\{', final_compiled_content))
              status = "BESTÄTIGT (Gefunden)" if found else "FEHLGESCHLAGEN (Nicht gefunden)"
              log_lines.append(f"  - Node '{name}': {status}")

          log_lines.append("")
          log_lines.append("[+] Überprüfung der TeacupX Overclocking-Profile:")
          oc_profiles = ["opp-1300000000", "opp-1416000000", "opp-1512000000", "opp-667000000", "opp-700000000", "opp-800000000", "opp-933000000", "opp-1056000000"]
          for profile in oc_profiles:
              found = profile in final_compiled_content
              status = "ANGEWENDET (Aktiv)" if found else "FEHLT"
              log_lines.append(f"  - Profile '{profile}': {status}")

          log_lines.append("")
          log_lines.append("[✓] Gegencheck erfolgreich abgeschlossen. Keine Duplikate oder Kollisionen.")
          
          verification_log_text = "\n".join(log_lines) + "\n"
          with open("patch_verification.log", "w", encoding="utf-8") as log_file:
              log_file.write(verification_log_text)

          print(verification_log_text)
          print("[✓] SELF-HEALING ERFOLGREICH! Gegencheck und Master Patch abgeschlossen.")
          EOF

      - name: Upload Generated DTB Artifact & Verification Log
        uses: actions/upload-artifact@v4
        with:
          name: healed-rk3326-k36-dtb
          path: |
            rk3326-k36-linux.dtb
            patch_verification.log
          retention-days: 14

      - name: Commit and Push Updated DTB back to Repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rk3326-k36-linux.dtb patch_verification.log
          git diff --quiet && git diff --staged --quiet || (git commit -m "fix(dtb): add verification log and prevent duplicate nodes [skip ci]" && git push)
