name: DTB RAM Analysis (Stock vs ArkOS vs K36S)

on:
  workflow_dispatch:

jobs:
  analyze-dtb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install DTC
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler

      - name: Decompile and Compare DTB Memory Sections
        run: |
          python3 - << 'EOF'
          import subprocess
          import re
          import os

          FILES_TO_CHECK = [
              "rg32tw3ka.dtb",              # Stock EmuELEC (Goldstandard)
              "rk3326-m9pro-linux.dtb",     # Aktuelle ArkOS Basis
              "k36s-working.dtb"            # K36S Referenz (falls vorhanden)
          ]
          
          OUTPUT_LOG = "dtb_ram_comparison.txt"
          log = "==================================================\n"
          log += "   DTB RAM COMPARISON (Stock vs ArkOS vs K36S)\n"
          log += "==================================================\n\n"

          def analyze_file(dtb_name):
              res_log = f"--- Analyzing {dtb_name} ---\n"
              if not os.path.exists(dtb_name):
                  return res_log + "[!] File not found. Skipped.\n\n"
              
              dts_name = dtb_name + ".dts"
              subprocess.run(["dtc", "-I", "dtb", "-O", "dts", "-o", dts_name, dtb_name], 
                             capture_output=True, check=True)
              
              with open(dts_name, "r") as f:
                  text = f.read()
              
              # 1. Memory Node finden
              mem_matches = re.findall(r'(memory(?:@[0-9a-fA-F]+)?\s*\{[^}]*?reg\s*=\s*<[^>]+>[^}]*?\};)', text, re.DOTALL)
              if mem_matches:
                  res_log += "[+] Memory Node(s):\n"
                  for m in mem_matches:
                      # Bereinige den String für die Ausgabe (Whitespace reduzieren)
                      clean_m = " ".join(m.split())
                      res_log += f"    {clean_m}\n"
              else:
                  res_log += "[!] No 'memory' node found.\n"

              # 2. Reserved Memory finden
              res_matches = re.findall(r'(reserved-memory\s*\{.*?\n\t\};)', text, re.DOTALL)
              if res_matches:
                  res_log += "\n[+] Reserved Memory Sizes:\n"
                  for r in res_matches:
                      # Suche nach Sub-Nodes mit size-Eigenschaft
                      sizes = re.findall(r'([a-zA-Z0-9,_-]+)\s*\{[^}]*?size\s*=\s*<([^>]+)>', r, re.DOTALL)
                      for name, size in sizes:
                          clean_size = " ".join(size.split())
                          res_log += f"    - {name}: size = <{clean_size}>\n"
                  
                  # Suche nach globalen Einträgen wie linux,cma
                  cma = re.search(r'linux,cma\s*\{[^}]*?size\s*=\s*<([^>]+)>', text, re.DOTALL)
                  if cma:
                      clean_cma = " ".join(cma.group(1).split())
                      res_log += f"    - linux,cma (global): size = <{clean_cma}>\n"
              else:
                  res_log += "[!] No 'reserved-memory' block found.\n"

              return res_log + "\n"

          for file in FILES_TO_CHECK:
              log += analyze_file(file)

          with open(OUTPUT_LOG, "w") as f:
              f.write(log)
          print(log)
          EOF

      - name: Upload Comparison Log
        uses: actions/upload-artifact@v4
        with:
          name: dtb-ram-comparison
          path: dtb_ram_comparison.txt
