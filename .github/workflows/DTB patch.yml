name: PRO MODE - RK3326 Ultimate DTB Patcher

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pro-patch-dtb:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Device Tree Compiler & Python
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler python3 python3-git

      - name: Execute Advanced DTS Parser & Patcher
        run: |
          python3 - << 'EOF'
          import re
          import subprocess
          import os

          original_dtb = "rg32tw3ka.dtb"
          target_dtb = "rk3326-k36-linux.dtb"
          orig_dts = "original_decompiled.dts"
          target_dts = "target_decompiled.dts"
          merged_dts = "merged.dts"
          final_dtb = "rk3326-k36-linux.dtb"

          if not os.path.exists(original_dtb):
              print(f"[!] FEHLER: Original-DTB '{original_dtb}' fehlt im Repository!")
              exit(1)

          print(f"[*] Dekompiliere Original-DTB ({original_dtb})...")
          subprocess.run(["dtc", "-I", "dtb", "-O", "dts", "-f", "-o", orig_dts, original_dtb], check=True)

          if os.path.exists(target_dtb):
              print(f"[*] Dekompiliere Ziel-DTB ({target_dtb})...")
              res = subprocess.run(["dtc", "-I", "dtb", "-O", "dts", "-f", "-o", target_dts, target_dtb])
              if res.returncode != 0:
                  print("[!] Ziel-DTB korrupt. Nutze Original als Basis.")
                  subprocess.run(["cp", orig_dts, target_dts], check=True)
          else:
              subprocess.run(["cp", orig_dts, target_dts], check=True)

          with open(target_dts, "r", encoding="utf-8") as f:
              content = f.read()

          with open(orig_dts, "r", encoding="utf-8") as f:
              orig_content = f.read()

          print("[*] Starte tiefgreifende Node-Extraktion (Brace-Counting)...")

          # --- PRO-FUNKTION: Extrahiert vollständige Nodes inkl. aller Unterebenen ---
          def extract_nodes_by_keywords(text, keywords):
              extracted_blocks = []
              for i, char in enumerate(text):
                  if char == '{':
                      start_decl = text.rfind('\n', 0, i)
                      if start_decl == -1: start_decl = 0
                      decl = text[start_decl:i].strip()
                      
                      # Überprüfen, ob eines der Keywords im Node-Namen steckt
                      if any(kw.lower() in decl.lower() for kw in keywords) and not decl.startswith('/'):
                          brace_count = 1
                          end_idx = -1
                          for j in range(i + 1, len(text)):
                              if text[j] == '{': brace_count += 1
                              elif text[j] == '}': brace_count -= 1
                              
                              if brace_count == 0:
                                  end_idx = j + 1
                                  if end_idx < len(text) and text[end_idx] == ';': end_idx += 1
                                  break
                          
                          if end_idx != -1:
                              block = text[start_decl:end_idx].strip()
                              extracted_blocks.append((decl.split()[0], block))
              return extracted_blocks

          # 1. Hardware-Nodes aus dem Original extrahieren
          target_keywords = ["rgb", "pwm", "led", "light", "pcie", "pcim", "wlan", "wifi", "sdio", "rk915"]
          found_nodes = extract_nodes_by_keywords(orig_content, target_keywords)

          # 2. Nodes in die Ziel-DTS integrieren
          last_brace = content.rfind("};")
          if last_brace != -1:
              injections = "\n\t/* --- START INJECTED M9PRO HARDWARE NODES --- */\n"
              for node_name, block in found_nodes:
                  # Verhindern, dass Standard-Batterie-LEDs doppelt gemeldet werden
                  if "battery" in node_name.lower(): continue
                  
                  # Prüfen, ob der exakte Node-Name im Ziel schon existiert
                  if node_name not in content:
                      print(f"[+] Injiziere fehlenden Hardware-Node: {node_name}")
                      injections += "\t" + block.replace("\n", "\n\t") + "\n\n"
                  else:
                      # Falls er existiert (z.B. SDIO), erzwingen wir per Overwrite den "okay" Status
                      if "sdio" in node_name.lower() or "pcie" in node_name.lower():
                          print(f"[*] Node {node_name} existiert. Erzwinge Aktivierung (status = 'okay')...")
                          # Wir überschreiben disabled mit okay im Ziel-Content
                          content = re.sub(r'(' + re.escape(node_name) + r'[^}]*status\s*=\s*")disabled(";)', r'\1okay\2', content)

              injections += "\t/* --- END INJECTED M9PRO HARDWARE NODES --- */\n"
              content = content[:last_brace] + injections + content[last_brace:]

          # 3. TeacupX Overclocking (CPU, GPU, RAM) sicher anwenden
          print("[*] Wende TeacupX Overclocking-Profile an...")
          # Alte Frequenzen entfernen
          content = re.sub(r'&(?:cpu0_opp_table|gpu_opp_table|dmc_opp_table)\s*\{[^}]*\};\s*', '', content)
          content = re.sub(r'\s*opp-(?:1300000000|1416000000|1512000000|667000000|700000000|800000000|933000000|1056000000)\s*\{[^}]*?\};', '', content)

          # CPU OC (1.5 GHz)
          cpu_oc = """
          		opp-1300000000 { opp-hz = < 0x00 0x4d784000 >; opp-microvolt = < 0x1406f0 >; };
          		opp-1416000000 { opp-hz = < 0x00 0x5463b000 >; opp-microvolt = < 0x14fb18 >; };
          		opp-1512000000 { opp-hz = < 0x00 0x5a1f4000 >; opp-microvolt = < 0x155cc0 >; };"""
          if m := re.search(r'(opp-(?:1200000000|1100000000|1000000000|312000000)\s*\{[^}]*\};)', content):
              content = content[:m.end()] + "\n" + cpu_oc + content[m.end():]

          # GPU OC (800 MHz)
          gpu_oc = """
          		opp-667000000 { opp-hz = < 0x00 0x27c95b00 >; opp-microvolt = < 0x13d620 >; };
          		opp-700000000 { opp-hz = < 0x00 0x29b92700 >; opp-microvolt = < 0x1406f0 >; };
          		opp-800000000 { opp-hz = < 0x00 0x2fa0be00 >; opp-microvolt = < 0x14f000 >; };"""
          if m := re.search(r'(opp-(?:520000000|600000000|400000000|200000000)\s*\{[^}]*\};)', content):
              content = content[:m.end()] + "\n" + gpu_oc + content[m.end():]

          # RAM OC (1056 MHz)
          dmc_oc = """
          		opp-933000000 { opp-hz = < 0x00 0x379c29c0 >; };
          		opp-1056000000 { opp-hz = < 0x00 0x3ef14800 >; };"""
          if m := re.search(r'(opp-786000000\s*\{[^}]*\};|opp-667000000\s*\{[^}]*\};|dmc-opp-table\s*\{)', content):
              content = content[:m.end()] + "\n" + dmc_oc + content[m.end():]

          # Speichern
          with open(merged_dts, "w", encoding="utf-8") as f:
              f.write(content)

          print(f"[*] Kompiliere finale DTB ({final_dtb}) zurück...")
          # PRO-FIX: Input Flag auf '-I dts' gesetzt!
          subprocess.run(["dtc", "-I", "dts", "-O", "dtb", "-f", "-o", final_dtb, merged_dts], check=True)
          print("[✓] PRO PATCH ERFOLGREICH! DTB ist perfektionsbereit.")
          EOF

      - name: Upload Generated DTB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pro-patched-rk3326-k36-dtb
          path: rk3326-k36-linux.dtb
          retention-days: 14

      - name: Commit and Push Updated DTB back to Repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rk3326-k36-linux.dtb
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(pro-mode): deep parsing of original dtb, extract full blocks for rgb/wifi/pcie, inject to target [skip ci]" && git push)
