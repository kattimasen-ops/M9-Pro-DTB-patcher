name: Ultimate CFW Search & Build RK915 WiFi Package

on:
  workflow_dispatch:

jobs:
  search-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Durchsuche dArkOSRE, arkos4clone, Rocknix, EmuELEC & GitHub nach echten Dateien
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import os
          import json
          import urllib.request
          import urllib.error
          import subprocess
          import shutil

          output_dir = "wifi_package"
          firmware_dir = os.path.join(output_dir, "lib", "firmware")
          os.makedirs(firmware_dir, exist_ok=True)

          cal_path = os.path.join(firmware_dir, "rk915_cal.bin")
          para_path = os.path.join(firmware_dir, "rk915_rf_para.txt")

          token = os.environ.get("GITHUB_TOKEN")
          got_cal = False
          got_para = False

          def search_github_api(filename, dest_path):
              print(f"[*] Suche über GitHub API nach '{filename}'...")
              api_url = f"https://api.github.com/search/code?q={filename}+filename:{filename}"
              req = urllib.request.Request(
                  api_url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "M9Pro-Firmware-Finder"
                  }
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      data = json.loads(response.read().decode())
                      if "items" in data and len(data["items"]) > 0:
                          for item in data["items"]:
                              html_url = item.get("html_url")
                              raw_url = html_url.replace("github.com", "raw.githubusercontent.com").replace("/blob/", "/")
                              print(f"[+] Versuche Download von: {raw_url}")
                              try:
                                  urllib.request.urlretrieve(raw_url, dest_path)
                                  if os.path.exists(dest_path) and os.path.getsize(dest_path) > 10:
                                      print(f"[✓] {filename} erfolgreich via API geladen!")
                                      return True
                              except Exception as e:
                                  print(f"[-] Download fehlgeschlagen: {e}")
              except Exception as e:
                  print(f"[-] GitHub API Such-Fehler: {e}")
              return False

          # 1. API-Suche starten
          if not got_cal:
              got_cal = search_github_api("rk915_cal.bin", cal_path)
          if not got_para:
              got_para = search_github_api("rk915_rf_para.txt", para_path)

          # 2. Gezieltes Klonen aller relevanten Custom-Firmware-Quellen (inkl. dArkOSRE & arkos4clone)
          if not got_cal or not got_para:
              print("[*] API-Suche unvollständig. Klone und durchsuche dArkOSRE, arkos4clone, Rocknix, EmuELEC...")
              target_repos = [
                  "https://github.com/southoz/dArkOSRE-R36.git",
                  "https://github.com/lcdyk0517/arkos4clone.git",
                  "https://github.com/ROCKNIX/distribution.git",
                  "https://github.com/EmuELEC/EmuELEC.git",
                  "https://github.com/AeolusUX/ArkOS-R3XS.git"
              ]
              
              os.makedirs("cfw_clones", exist_ok=True)
              for repo in target_repos:
                  repo_name = repo.split("/")[-1].replace(".git", "")
                  local_repo_path = os.path.join("cfw_clones", repo_name)
                  print(f"[*] Klone Repository (shallow): {repo} ...")
                  try:
                      subprocess.run(["git", "clone", "--depth", "1", repo, local_repo_path], check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  except Exception as e:
                      print(f"[-] Konnte {repo} nicht klonen: {e}")
                      continue

                  for root, dirs, files in os.walk(local_repo_path):
                      if not got_cal and "rk915_cal.bin" in files:
                          src = os.path.join(root, "rk915_cal.bin")
                          shutil.copy2(src, cal_path)
                          print(f"[✓] rk915_cal.bin aus {repo_name} extrahiert!")
                          got_cal = True
                      if not got_para and "rk915_rf_para.txt" in files:
                          src = os.path.join(root, "rk915_rf_para.txt")
                          shutil.copy2(src, para_path)
                          print(f"[✓] rk915_rf_para.txt aus {repo_name} extrahiert!")
                          got_para = True

                  if got_cal and got_para:
                      print("[✓] Beide Dateien erfolgreich in Repositories gefunden!")
                      break

          # KEINE PLATZHALTER: Strenger Check bricht bei Nichterfolg hart ab
          if not got_cal or not got_para:
              raise RuntimeError("[X] FEHLER: Die echten RK915 Firmware-Dateien konnten in keiner Quelle gefunden werden!")

          print("[✓] Verifikation erfolgreich: Echte Binärdateien bereitgestellt.")

          # 3. Generiere das passende .sh Installationsskript
          sh_script_path = os.path.join(output_dir, "install_wifi.sh")
          sh_content = """#!/bin/bash
          # ==========================================
          # M9 Pro RK915 WiFi Auto-Installer Skript
          # ==========================================

          if [ "$EUID" -ne 0 ]; then
            echo "[-] Bitte starte das Skript mit Root-Rechten (sudo ./install_wifi.sh)!"
            exit 1
          fi

          echo "[*] Starte WLAN-Installation für M9 Pro..."
          
          # Partition beschreibbar machen
          mount -o remount,rw / 2>/dev/null || true

          # Zielordner anlegen
          mkdir -p /lib/firmware

          # Dateien kopieren
          if [ -d "./lib/firmware" ]; then
              cp -v ./lib/firmware/rk915_cal.bin /lib/firmware/
              cp -v ./lib/firmware/rk915_rf_para.txt /lib/firmware/
          elif [ -f "./rk915_cal.bin" ] && [ -f "./rk915_rf_para.txt" ]; then
              cp -v ./rk915_cal.bin /lib/firmware/
              cp -v ./rk915_rf_para.txt /lib/firmware/
          else
              echo "[-] Fehler: Firmware-Dateien im Verzeichnis nicht gefunden!"
              exit 1
          fi

          # Rechte korrigieren
          chmod 644 /lib/firmware/rk915_cal.bin
          chmod 644 /lib/firmware/rk915_rf_para.txt

          echo "[*] Initialisiere RK915 Kernel-Modul..."
          modprobe -r rk915 2>/dev/null || true
          modprobe rk915 2>/dev/null || true

          echo "=========================================="
          echo "[✓] Installation erfolgreich abgeschlossen!"
          echo "Bitte starte das M9 Pro jetzt einmal neu."
          echo "=========================================="
          """

          with open(sh_script_path, "w", encoding="utf-8") as f:
              f.write(sh_content)
          
          os.chmod(sh_script_path, 0o755)
          print("[✓] Installations-Skript 'install_wifi.sh' fehlerfrei generiert.")
          EOF

      - name: Paket als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: m9pro-wifi-complete-kit
          path: wifi_package/
          retention-days: 7
