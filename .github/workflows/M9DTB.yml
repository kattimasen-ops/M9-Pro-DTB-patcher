name: Create M9 Pro DTB for ArkOS4Clones

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-dtb:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install DTC & Python
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler python3

      - name: Patch M9 Pro DTB with Multi-Donor Joystick RGB LED Controls and Display Fixes
        run: |
          python3 - << 'EOF'
          import re, subprocess, os, sys

          BASE_DTB = "rk3326-m9pro-linux.dtb"
          DONOR_DTBS = [
              "rg32tw3ka.dtb",
              "rk3326-r36tmax-linux.dtb",
              "rk3326-k36s-linux.dtb",
              "rk3326-k36-linux.dtb"
          ]
          OUTPUT_DTB = "rk3326-m9pro-linux.dtb.patched"

          if not os.path.exists(BASE_DTB):
              print(f"[!] ERROR: Target base file '{BASE_DTB}' not found in repo root!")
              sys.exit(1)

          def decompile(dtb_path, dts_path):
              subprocess.run(["dtc", "-I", "dtb", "-O", "dts", "-f",
                              "-Wno-unique_unit_address", "-Wno-graph_child_address",
                              "-o", dts_path, dtb_path], check=True)

          def find_node_boundaries(dts_content, node_name):
              pattern = re.compile(r'(?:^[ \t]*|[ \t]+)([a-zA-Z0-9_-]+:\s*)?' + re.escape(node_name) + r'(?:@[a-zA-Z0-9_,+-]+)?\s*\{', re.MULTILINE)
              match = pattern.search(dts_content)
              if not match: return None, None
              start_idx = match.start()
              brace_idx = dts_content.find('{', start_idx)
              brace_count = 1
              for i in range(brace_idx + 1, len(dts_content)):
                  if dts_content[i] == '{': brace_count += 1
                  elif dts_content[i] == '}': brace_count -= 1
                  if brace_count == 0:
                      end_idx = i + 1
                      if end_idx < len(dts_content) and dts_content[end_idx] == ';': end_idx += 1
                      return start_idx, end_idx
              return None, None

          def purge_node(text, node_name):
              while True:
                  start, end = find_node_boundaries(text, node_name)
                  if start is None: break
                  text = text[:start] + text[end:]
              return text

          def build_phandle_map(dts_content):
              pmap = {}
              for match in re.finditer(r'(?:linux,phandle|phandle)\s*=\s*<(0x[0-9a-fA-F]+)>;', dts_content):
                  ph_val = match.group(1)
                  text_before = dts_content[:match.start()]
                  brace_idx = text_before.rfind('{')
                  if brace_idx != -1:
                      node_decl = text_before[:brace_idx].strip().split('\n')[-1].strip()
                      node_name = node_decl.split(':')[-1].strip().split()[0]
                      pmap[node_name] = ph_val
              return pmap

          def extract_root_nodes_by_keywords(text, keywords):
              extracted_blocks = []
              for match in re.finditer(r'^[ \t]*([a-zA-Z0-9_,+-]+)(?:@[a-zA-Z0-9_,+-]+)?\s*\{', text, re.MULTILINE):
                  decl = match.group(0)
                  node_name = match.group(1)
                  start_idx = match.start()
                  if any(kw.lower() in decl.lower() for kw in keywords):
                      brace_count = 1
                      brace_idx = text.find('{', start_idx)
                      end_idx = -1
                      for j in range(brace_idx + 1, len(text)):
                          if text[j] == '{': brace_count += 1
                          elif text[j] == '}': brace_count -= 1
                          if brace_count == 0:
                              end_idx = j + 1
                              if end_idx < len(text) and text[end_idx] == ';': end_idx += 1
                              break
                      if end_idx != -1:
                          extracted_blocks.append((node_name, text[start_idx:end_idx].strip()))
              return extracted_blocks

          def insert_props_at_node_start(node_block, props_lines):
              """Insert props_lines (list of strings) right after the opening '{'
              of node_block, so they come before any subnode and before any
              existing property. Returns the modified block."""
              open_brace = node_block.find('{')
              if open_brace == -1:
                  return node_block
              indent = "\n\t\t"
              body = "".join(f"{indent}{line}" for line in props_lines)
              return node_block[:open_brace + 1] + body + node_block[open_brace + 1:]

          def remove_prop(text, prop_name):
              # remove any existing occurrences (horizontal whitespace only,
              # so we don't join lines)
              pattern = re.compile(r'[ \t]*' + re.escape(prop_name) + r'\s*=\s*<[^>]*>;[ \t]*\n?')
              text = pattern.sub('', text)
              pattern_simple = re.compile(r'[ \t]*' + re.escape(prop_name) + r'\s*;[ \t]*\n?')
              text = pattern_simple.sub('', text)
              return text

          print(f"[*] Decompiling Base DTB: {BASE_DTB}")
          decompile(BASE_DTB, "base.dts")

          with open("base.dts", "r", encoding="utf-8") as f:
              base_dts = f.read()

          # Remove previous injections (idempotent re-runs)
          base_dts = re.sub(r'\n\t/\* --- INJECTED.*?/\* --- END INJECTED.*?\*/\n',
                            '', base_dts, flags=re.DOTALL)
          for node in ["vcc-led", "ledvcc-en-gpio", "play_joystick",
                       "zed", "zed_gadget", "zed_service"]:
              base_dts = purge_node(base_dts, node)

          # ---------------------------------------------------------------
          # DISPLAY FIXES
          # ---------------------------------------------------------------
          # 1) auto-freq-en = <0>: disables DMC load-based DDR frequency
          #    scaling. Reference: Rockchip DDR Developer Guide (EN), p.4.
          # 2) vop-dclk-mode = <1>: DCLK is never divided, so a DDR
          #    frequency change cannot disturb the display. Same guide.
          # 3) rockchip,disable-device-link-resume on the VOP prevents
          #    IOMMU page faults that cause black screens. Reference:
          #    [PATCH 3/3] arm64: dts: rockchip: Disable device link for
          #    RK3328 VOP (Jagan Teki, 2023-03-30).
          #
          # The properties go right after the opening brace of each node,
          # so they precede all subnodes (DTS spec: properties must come
          # before subnodes).
          # ---------------------------------------------------------------
          dmc_start, dmc_end = find_node_boundaries(base_dts, "dmc")
          if dmc_start is not None and dmc_end is not None:
              dmc_block = base_dts[dmc_start:dmc_end]
              dmc_block = remove_prop(dmc_block, "auto-freq-en")
              dmc_block = remove_prop(dmc_block, "vop-dclk-mode")
              dmc_block = insert_props_at_node_start(
                  dmc_block,
                  ["auto-freq-en = <0>;", "vop-dclk-mode = <1>;"]
              )
              base_dts = base_dts[:dmc_start] + dmc_block + base_dts[dmc_end:]
              print("[*] DMC patched: auto-freq-en=0, vop-dclk-mode=1")
          else:
              print("[!] Warning: dmc node not found — display fix 1-2 not applied")

          vop_start, vop_end = find_node_boundaries(base_dts, "vop")
          if vop_start is not None and vop_end is not None:
              vop_block = base_dts[vop_start:vop_end]
              vop_block = remove_prop(vop_block, "rockchip,disable-device-link-resume")
              vop_block = insert_props_at_node_start(
                  vop_block,
                  ["rockchip,disable-device-link-resume;"]
              )
              base_dts = base_dts[:vop_start] + vop_block + base_dts[vop_end:]
              print("[*] VOP patched: rockchip,disable-device-link-resume")
          else:
              print("[!] Warning: vop node not found — display fix 3 not applied")

          # ---------------------------------------------------------------
          # Joystick RGB / ZED injection (unchanged behaviour)
          # ---------------------------------------------------------------
          base_map = build_phandle_map(base_dts)
          target_phandles = set(int(m.group(1), 16)
                                for m in re.finditer(r'(?:linux,phandle|phandle)\s*=\s*<(0x[0-9a-fA-F]+)>;', base_dts))
          new_ph_counter = max(target_phandles) + 1 if target_phandles else 0x1000

          injected_names = set()
          injections = "\n\t/* --- INJECTED M9 PRO JOYSTICK RGB LED & ZED NODES --- */\n"
          keywords = ["play_joystick", "zed", "zed_gadget", "zed_service",
                      "rgb", "joystick_led", "led_rgb"]

          for donor in DONOR_DTBS:
              if not os.path.exists(donor):
                  print(f"[!] Warning: Donor DTB '{donor}' not found. Skipping.")
                  continue

              donor_dts_file = f"{donor}.dts"
              print(f"[*] Decompiling Donor DTB: {donor}")
              decompile(donor, donor_dts_file)

              with open(donor_dts_file, "r", encoding="utf-8") as f:
                  donor_dts = f.read()

              donor_map = build_phandle_map(donor_dts)
              translation_dict = {d_ph: base_map[name]
                                  for name, d_ph in donor_map.items() if name in base_map}

              found_nodes = extract_root_nodes_by_keywords(donor_dts, keywords)

              internal_ph_map = {}
              for _, block in found_nodes:
                  for m in re.finditer(r'(?:linux,phandle|phandle)\s*=\s*<(0x[0-9a-fA-F]+)>;', block):
                      old_ph = m.group(1).lower()
                      if old_ph not in internal_ph_map:
                          internal_ph_map[old_ph] = f"0x{new_ph_counter:x}"
                          new_ph_counter += 1

              for node_name, block in found_nodes:
                  clean_name = node_name.split('@')[0]
                  if "battery" in clean_name.lower() or clean_name.lower() in ["charge-led-gpio"]:
                      continue
                  if clean_name in injected_names or find_node_boundaries(base_dts, clean_name)[0] is not None:
                      continue

                  injected_names.add(clean_name)
                  for orig_ph, targ_ph in translation_dict.items():
                      block = re.sub(r'\b' + orig_ph + r'\b', targ_ph, block, flags=re.IGNORECASE)
                  for old_internal, new_internal in internal_ph_map.items():
                      block = re.sub(r'\b' + old_internal + r'\b', new_internal, block, flags=re.IGNORECASE)

                  injections += "\t" + block.replace("\n", "\n\t") + "\n\n"

          if injected_names:
              last_brace = base_dts.rfind("};")
              if last_brace != -1:
                  injections += "\t/* --- END INJECTED M9 PRO NODES --- */\n"
                  base_dts = base_dts[:last_brace] + injections + base_dts[last_brace:]

          with open("merged.dts", "w", encoding="utf-8") as f:
              f.write(base_dts)

          print("[*] Compiling merged.dts to DTB ...")
          result = subprocess.run(["dtc", "-I", "dts", "-O", "dtb", "-f",
                                   "-Wno-unique_unit_address", "-Wno-graph_child_address",
                                   "-Wno-unit_address_format", "-Wno-avoid_unnecessary_addr_size",
                                   "-Wno-i2c_bus_reg", "-Wno-simple_bus_reg",
                                   "-o", OUTPUT_DTB, "merged.dts"],
                                  capture_output=True, text=True)
          if result.returncode != 0:
              print("[!] dtc failed:")
              print(result.stderr)
              print("[!] Dumping the offending lines around the error ...")
              sys.exit(1)
          print("[*] dtc ok.")

          decompile(OUTPUT_DTB, "verify.dts")
          with open("verify.dts", "r", encoding="utf-8") as f:
              final_text = f.read()

          log = [
              "==================================================",
              "      M9 PRO DTB PATCH LOG (JOYSTICK + DISPLAY)",
              "==================================================",
              f"Base File: {BASE_DTB}",
              f"Output File: {OUTPUT_DTB}",
              f"Donors Scanned: {', '.join(DONOR_DTBS)}",
              "",
              "[+] Display fixes applied:",
              f"  - DMC auto-freq-en=0: {'OK' if 'auto-freq-en = <0>' in final_text else 'MISSING'}",
              f"  - DMC vop-dclk-mode=1: {'OK' if 'vop-dclk-mode = <1>' in final_text else 'MISSING'}",
              f"  - VOP disable-device-link-resume: {'OK' if 'rockchip,disable-device-link-resume' in final_text else 'MISSING'}",
              "",
              "[+] Injected Joystick RGB / Zed nodes:"
          ]
          for name in sorted(injected_names):
              log.append(f"  - {name}: {'OK' if name in final_text else 'MISSING'}")

          log_text = "\n".join(log)
          with open("patch_verification.log", "w", encoding="utf-8") as f:
              f.write(log_text)
          print(log_text)
          EOF

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m9pro-patched-dtb
          path: |
            rk3326-m9pro-linux.dtb.patched
            patch_verification.log
          retention-days: 14

      - name: Commit and Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rk3326-m9pro-linux.dtb.patched patch_verification.log
          git diff --quiet && git diff --staged --quiet || git commit -m "fix(dtb): add DDR/DMC and VOP IOMMU fixes for RK3326 display stability [skip ci]"
          git pull --rebase origin main || true
          git push origin main
