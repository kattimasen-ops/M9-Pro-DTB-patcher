name: M9 Pro DTB - Safe RAM Fix Only

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fix-ram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install DTC & Python
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler python3

      - name: Patch DTB (RAM Only)
        run: |
          python3 - << 'EOF'
          import re
          import subprocess
          import os
          import sys

          BASE_DTB = "rk3326-m9pro-linux.dtb"
          OUTPUT_DTB = "rk3326-m9pro-linux.dtb.patched"
          VERIFY_DTS = "verify.dts"

          if not os.path.exists(BASE_DTB):
              print(f"[!] ERROR: {BASE_DTB} not found!")
              sys.exit(1)

          print(f"[*] Decompiling {BASE_DTB}...")
          subprocess.run(["dtc", "-I", "dtb", "-O", "dts", "-o", "base.dts", BASE_DTB], check=True)

          with open("base.dts", "r") as f:
              dts = f.read()

          # ==========================================
          # 1. FIX: Memory Node (Ensure 1GB)
          # ==========================================
          print("[*] Checking memory node...")
          memory_pattern = re.compile(r'(memory(?:@[0-9a-fA-F]+)?\s*\{[^}]*?reg\s*=\s*)<([^>]+)>(\s*;)', re.DOTALL)
          
          def fix_memory(match):
              reg_val = match.group(2).strip()
              parts = reg_val.split()
              if parts:
                  try:
                      size = int(parts[-1], 16)
                      if size < 0x40000000:
                          print(f"    -> Found smaller RAM size ({hex(size)}). Patching to 1GB (0x40000000).")
                          return f"{match.group(1)}<0x0 0x0 0x0 0x40000000>{match.group(3)}"
                      else:
                          print(f"    -> RAM size is already {hex(size)}. No change needed.")
                  except ValueError:
                      pass
              return match.group(0)

          dts = memory_pattern.sub(fix_memory, dts)

          # ==========================================
          # 2. FIX: CMA (Continuous Memory Allocator)
          # ==========================================
          # The GPU often reserves a huge CMA pool. Reduce to 64MB to free usable RAM.
          print("[*] Checking linux,cma reserved memory...")
          cma_pattern = re.compile(r'(linux,cma\s*\{[^}]*?size\s*=\s*)<([^>]+)>', re.DOTALL)
          
          def fix_cma(match):
              size_val = match.group(2).strip()
              parts = size_val.split()
              if parts:
                  try:
                      size = int(parts[-1], 16)
                      if size > 0x4000000: # If larger than 64MB
                          print(f"    -> Found large CMA pool ({hex(size)}). Reducing to 64MB (0x4000000).")
                          return f"{match.group(1)}<0x0 0x4000000>"
                      else:
                          print(f"    -> CMA size is already small enough ({hex(size)}). No change needed.")
                  except ValueError:
                      pass
              return match.group(0)

          dts = cma_pattern.sub(fix_cma, dts)

          # ==========================================
          # COMPILE & LOG
          # ==========================================
          with open("patched.dts", "w") as f:
              f.write(dts)

          print(f"[*] Compiling {OUTPUT_DTB}...")
          subprocess.run(["dtc", "-I", "dts", "-O", "dtb", "-o", OUTPUT_DTB, "patched.dts"], check=True)
          
          print("[+] Success! DTB patched.")
          
          subprocess.run(["dtc", "-I", "dtb", "-O", "dts", "-o", VERIFY_DTS, OUTPUT_DTB], check=True)
          with open(VERIFY_DTS, "r") as f:
              verify_text = f.read()
              
          with open("ram_fix_log.txt", "w") as f:
              f.write("M9 PRO RAM FIX LOG\n")
              f.write("==================\n")
              f.write(f"Memory Node (1GB): {'OK' if '0x0 0x0 0x0 0x40000000' in verify_text else 'CHECK DTS'}\n")
              f.write(f"CMA Node (64MB):   {'OK' if '0x0 0x4000000' in verify_text else 'CHECK DTS'}\n")
              
          EOF

      - name: Upload Patched DTB
        uses: actions/upload-artifact@v4
        with:
          name: m9pro-ram-fixed-dtb
          path: |
            rk3326-m9pro-linux.dtb.patched
            ram_fix_log.txt
          retention-days: 14

      - name: Commit and Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # 1. Server-Stand abrufen
          git fetch origin main
          # 2. Lokale Historie hart auf Server-Stand setzen (verhindert Rebase-Konflikte)
          git reset --hard origin/main

          # 3. Generierte Dateien stagen und committen
          git add rk3326-m9pro-linux.dtb.patched ram_fix_log.txt
          git commit -m "fix(dtb): safe RAM and CMA adjustment to unlock full 1GB [skip ci]"
          
          # 4. Pushen
          git push origin main
