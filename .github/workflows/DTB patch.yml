name: RK3326 DTB Overclock & Hardware Patcher

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch-dtb:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Device Tree Compiler (dtc)
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler python3

      - name: Run DTB Decompilation and Patch Script
        run: |
          python3 - << 'EOF'
          import re
          import subprocess
          import os

          dtb_input = "rg32tw3ka.dtb"
          dts_interim = "decompiled.dts"
          dtb_output = "rk3326-k36s-linux.dtb"

          if not os.path.exists(dtb_input):
              raise FileNotFoundError(f"Eingabe-DTB '{dtb_input}'-Datei wurde im Repository nicht gefunden!")

          print(f"[*] Dekompiliere {dtb_input} mit dtc...")
          subprocess.run(["dtc", "-I", "dtb", "-O", "dts", "-o", dts_interim, dtb_input], check=True)

          with open(dts_interim, "r", encoding="utf-8") as f:
              content = f.read()

          print("[*] Analysiere und patche DTS-Einträge...")

          # 1. Bereinige evtl. veraltete fehlerhafte Label-Referenzen im Root
          content = re.sub(r'&(?:cpu0_opp_table|gpu_opp_table|dmc_opp_table)\s*\{[^}]*\};\s*', '', content)

          # 2. Füge Analogstick-LEDs hinzu (falls nicht vorhanden)
          if "led_left_stick" not in content and "gpio-leds" not in content:
              led_node = """
          	/* TeacupX / M9Pro Hardware - Analogstick LEDs */
          	gpio-leds {
          		compatible = "gpio-leds";
          		pinctrl-names = "default";

          		stick_led_left {
          			label = "led_left_stick";
          			gpios = <&gpio3 0x08 0x00>;
          			default-state = "on";
          		};

          		stick_led_right {
          			label = "led_right_stick";
          			gpios = <&gpio3 0x09 0x00>;
          			default-state = "on";
          		};
          	};
          """
              last_brace = content.rfind("};")
              if last_brace != -1:
                  content = content[:last_brace] + led_node + "\n" + content[last_brace:]

          # 3. Füge Wireless WLAN hinzu (falls nicht vorhanden)
          if "wireless-wlan" not in content and "wlan-platdata" not in content:
              wifi_node = """
          	/* TeacupX Hardware - Wireless WLAN */
          	wireless_wlan: wireless-wlan {
          		compatible = "wlan-platdata";
          		wifi_chip_type = "generic";
          		status = "okay";
          	};
          """
              last_brace = content.rfind("};")
              if last_brace != -1:
                  content = content[:last_brace] + wifi_node + "\n" + content[last_brace:]

          # 4. Füge Wireless Bluetooth hinzu (falls nicht vorhanden)
          if "wireless-bluetooth" not in content and "bluetooth-platdata" not in content:
              bt_node = """
          	/* TeacupX Hardware - Wireless Bluetooth */
          	wireless_bluetooth: wireless-bluetooth {
          		compatible = "bluetooth-platdata";
          		wifi-bt-power-toggle;
          		status = "okay";
          	};
          """
              last_brace = content.rfind("};")
              if last_brace != -1:
                  content = content[:last_brace] + bt_node + "\n" + content[last_brace:]

          # 5. Aktiviere SDIO (wichtig für WLAN)
          content = re.sub(r'(sdio\s*\{[^}]*status\s*=\s*")disabled(";)', r'\1okay\2', content)

          # 6. TeacupX Overclocking Frequenzen (CPU, GPU, RAM/DMC) einfügen
          cpu_oc = """
          		opp-1300000000 {
          			opp-hz = < 0x00 0x4d784000 >;
          			opp-microvolt = < 0x1406f0 >;
          		};
          		opp-1416000000 {
          			opp-hz = < 0x00 0x5463b000 >;
          			opp-microvolt = < 0x14fb18 >;
          		};
          		opp-1512000000 {
          			opp-hz = < 0x00 0x5a1f4000 >;
          			opp-microvolt = < 0x155cc0 >;
          		};"""

          if "opp-1300000000" not in content:
              m = re.search(r'(opp-(?:1200000000|1100000000|1000000000|312000000)\s*\{[^}]*\};)', content)
              if m:
                  pos = m.end()
                  content = content[:pos] + "\n" + cpu_oc + content[pos:]

          gpu_oc = """
          		opp-667000000 {
          			opp-hz = < 0x00 0x27c95b00 >;
          			opp-microvolt = < 0x13d620 >;
          		};
          		opp-700000000 {
          			opp-hz = < 0x00 0x29b92700 >;
          			opp-microvolt = < 0x1406f0 >;
          		};
          		opp-800000000 {
          			opp-hz = < 0x00 0x2fa0be00 >;
          			opp-microvolt = < 0x14f000 >;
          		};"""

          if "opp-700000000" not in content:
              m = re.search(r'(opp-(?:520000000|600000000|400000000|200000000)\s*\{[^}]*\};)', content)
              if m:
                  pos = m.end()
                  content = content[:pos] + "\n" + gpu_oc + content[pos:]

          dmc_oc = """
          		opp-933000000 {
          			opp-hz = < 0x00 0x379c29c0 >;
          		};
          		opp-1056000000 {
          			opp-hz = < 0x00 0x3ef14800 >;
          		};"""

          if "opp-1056000000" not in content:
              m = re.search(r'(opp-786000000\s*\{[^}]*\};|opp-667000000\s*\{[^}]*\};|dmc-opp-table\s*\{)', content)
              if m:
                  pos = m.end()
                  content = content[:pos] + "\n" + dmc_oc + content[pos:]

          # Schreibe gepatchte DTS
          with open(dts_interim, "w", encoding="utf-8") as f:
              f.write(content)

          print(f"[*] Kompiliere modifizierte DTS zurück nach {dtb_output}...")
          subprocess.run(["dtc", "-I", "dts", "-O", "dtb", "-f", "-o", dtb_output, dts_interim], check=True)
          print("[✓] DTB erfolgreich generiert und gepatcht!")
          EOF

      - name: Upload Generated DTB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: patched-rk3326-dtb
          path: rk3326-k36s-linux.dtb
          retention-days: 14

      - name: Commit and Push Compiled DTB back to Repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rk3326-k36s-linux.dtb
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-generate and patch rk3326-k36s-linux.dtb with TeacupX OC & Hardware [skip ci]" && git push)
